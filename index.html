<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toprun - Inventory Management</title>
    <meta name="description" content="Toprun inventory and items management system with role-based access control, replenishment alerts, stock tracking, analytics, and reports." />
    <meta property="og:title" content="Toprun - Inventory Management" />
    <meta property="og:description" content="Toprun inventory and items management system with role-based access control, replenishment alerts, stock tracking, analytics, and reports." />
    <link rel="icon" type="image/svg+xml" href="/toprun-logo.svg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('toprun-theme') || localStorage.getItem('robopart-theme');
          var isDark = theme === 'dark';
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
